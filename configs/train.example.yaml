data:
  annotations: data/annotations.json
  image_dir: data/images
  validation_fraction: 0.1
  split_seed: 42

model:
  family: qwen2_5_vl
  path: models/Qwen2.5-VL-3B-Instruct
  processor_path: null
  model_kwargs:
    torch_dtype: bfloat16
    attn_implementation: flash_attention_2
  processor_kwargs:
    min_pixels: 3136
    max_pixels: 200704

judge:
  base_url: http://127.0.0.1:8000/v1
  model: focus-judge
  timeout: 300
  max_retries: 3
  max_workers: 16
  generation:
    max_tokens: 6000
    temperature: 0.0
    top_p: 0.1

reward:
  embedding_model: models/all-MiniLM-L6-v2
  nlp_model: en_core_web_lg
  device: cpu
  similarity_threshold: 0.5
  soft_coverage: true
  object_scale: 0.01
  weights:
    general:    {object: 0.25, attribute: 0.35, relation: 0.40, foreground: 0.0, background: 0.0}
    attribute:  {object: 0.10, attribute: 0.90, relation: -1.0, foreground: 0.0, background: 0.0}
    relation:   {object: 0.10, attribute: -1.0, relation: 0.90, foreground: 0.0, background: 0.0}
    foreground: {object: 0.25, attribute: 0.35, relation: 0.40, foreground: 1.0, background: -1.0}
    background: {object: 0.25, attribute: 0.35, relation: 0.40, foreground: -1.0, background: 1.0}

prompts:
  general: Please describe the image in detail.
  attribute: Please describe the image in detail, focusing on the attributes and characteristics of the objects.
  relation: Please describe the image in detail, focusing on the spatial relationships between objects.
  foreground: Please describe the image in detail, focusing on the foreground subject.
  background: Please describe the image in detail, focusing on the background elements and surrounding environment.
prompt_cycle: [general, attribute, relation, foreground, background, attribute, relation, background]

rollout:
  num_generations: 8
  max_prompt_length: 1024
  beta: 0.04
  advantage_epsilon: 0.0001
  flat_batch_advantage_std: 0.1
  log_completions: true
  generation:
    max_new_tokens: 512
    do_sample: true
    temperature: 0.9
  eval_generation:
    max_new_tokens: 512
    do_sample: true
    temperature: 0.001
    top_k: 1
    top_p: 0.0

training:
  output_dir: outputs/focus
  run_name: focus
  report_to: none
  seed: 42
  learning_rate: 2.0e-6
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 50
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  logging_steps: 1
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  bf16: true
  bf16_full_eval: true
  torch_empty_cache_steps: 1
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  resume_from_checkpoint: auto
